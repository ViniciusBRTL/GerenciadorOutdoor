<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pontos de Outdoor</title>
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Outdoors">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --ink:#141414; --ink-2:#2a2a2a; --paper:#f4f4f2; --card:#ffffff; --line:#1c1c1c;
  --muted:#6b6b6b; --accent:#e11d2e; --radius:10px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  padding-bottom:calc(96px + env(safe-area-inset-bottom));
}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}

/* ---------- Cabeçalho ---------- */
.topbar{
  background:var(--ink); color:#fff;
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
  display:flex; align-items:center; gap:12px;
}
.topbar .chev{width:34px;height:22px;flex:none}
.topbar .brand{flex:1;text-align:center;font-weight:800;letter-spacing:.14em;font-size:14px;text-transform:uppercase}
.topbar .year{
  width:5ch; background:transparent; border:0; color:#fff; text-align:right;
  font-weight:900; font-size:26px; letter-spacing:.02em; padding:0;
}
.titlebar{
  max-width:900px; margin:0 auto; padding:14px 16px 6px;
  display:flex; align-items:center; gap:14px;
}
.titlebar h1{
  margin:0; font-size:28px; font-weight:900; letter-spacing:.04em; text-transform:uppercase;
  display:flex; align-items:center; gap:8px;
}
.titlebar h1::before{content:"";width:0;height:0;border-left:14px solid var(--ink);border-top:10px solid transparent;border-bottom:10px solid transparent}
.titlebar .rule{flex:1;height:12px;background:var(--ink)}
.titlebar .city{
  width:11ch; max-width:36vw; background:transparent; border:0; text-align:right;
  font-weight:900; font-size:22px; text-transform:uppercase; padding:0; letter-spacing:.02em;
}
.titlebar input::placeholder,.topbar input::placeholder{opacity:.45}

/* ---------- Busca ---------- */
.searchbar{
  position:sticky; top:0; z-index:5; background:rgba(244,244,242,.94);
  backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
  border-bottom:1px solid #ddd;
}
.searchbar .inner{max-width:900px;margin:0 auto;padding:10px 16px;display:flex;gap:8px;align-items:center}
.search{
  flex:1; display:flex; align-items:center; gap:8px; background:#fff;
  border:2px solid var(--ink); border-radius:999px; padding:0 14px; height:44px;
}
.search svg{width:18px;height:18px;flex:none;opacity:.7}
.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:16px}
.iconbtn{
  width:44px;height:44px;flex:none;border-radius:50%;border:2px solid var(--ink);background:#fff;
  display:grid;place-items:center;font-size:20px;font-weight:900;line-height:1;
}
.count{max-width:900px;margin:0 auto;padding:10px 16px 0;color:var(--muted);font-size:13px}

/* ---------- Lista / cartões ---------- */
.list{max-width:900px;margin:0 auto;padding:8px 16px;display:flex;flex-direction:column;gap:22px}
.card{
  background:var(--card); border-radius:var(--radius); padding:12px 14px 16px;
  box-shadow:0 1px 0 rgba(0,0,0,.06),0 6px 18px rgba(0,0,0,.05);
  scroll-margin-top:80px;
}
.card.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 4px var(--accent)}100%{box-shadow:0 0 0 0 transparent}}
.head{display:flex;align-items:flex-start;gap:6px;margin-bottom:10px;font-size:15px}
.head .lbl{font-weight:800;padding-top:5px;white-space:nowrap}
.code-in{
  width:5.2ch;border:0;border-bottom:1px dashed #bbb;background:transparent;font-weight:800;
  font-size:15px;padding:4px 0;text-align:center;
}
.dash{padding-top:5px}
.addr{
  flex:1;min-width:0;border:0;border-bottom:1px dashed #bbb;background:transparent;resize:none;
  padding:4px 0;font-size:15px;line-height:1.35;overflow:hidden;outline:0;
}
.code-in:focus,.addr:focus{border-bottom-color:var(--ink);outline:0}
.del{
  flex:none;border:0;background:transparent;color:var(--muted);font-size:20px;line-height:1;
  padding:4px 6px;border-radius:6px;
}
.del:hover{color:var(--accent);background:#fdecee}
.body{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:640px){.body{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px}}
.photo{
  position:relative;border:0;padding:0;background:#e7e7e4;border-radius:8px;overflow:hidden;
  aspect-ratio:4/3;width:100%;display:block;
}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo .ph{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:14px;text-align:center;padding:20px}
.photo .badge{
  position:absolute;left:8px;bottom:8px;min-width:54px;height:54px;padding:0 8px;border-radius:999px;
  background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:900;font-size:22px;
  letter-spacing:.02em;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.35);
}
.photo .cam{
  position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.65);color:#fff;font-size:12px;
  padding:6px 10px;border-radius:999px;
}
.periods{display:flex;flex-direction:column;gap:2px}
.period{position:relative;padding-bottom:6px}
.period .plabel{
  width:100%;border:0;background:transparent;font-weight:800;text-transform:uppercase;font-size:13px;
  letter-spacing:.04em;padding:4px 24px 0 0;outline:0;
}
.period .ptext{
  width:100%;border:0;border-bottom:2px solid var(--ink);background:transparent;padding:6px 0 4px;
  font-size:16px;outline:0;border-radius:0;
}
.period .ptext:focus{border-bottom-color:var(--accent)}
.period .prm{
  position:absolute;right:0;top:0;border:0;background:transparent;color:var(--muted);
  font-size:16px;padding:2px 6px;opacity:.55;
}
.period .prm:hover{opacity:1;color:var(--accent)}
.addp{
  margin-top:6px;align-self:flex-start;border:1px dashed #999;background:transparent;color:var(--muted);
  border-radius:999px;padding:6px 12px;font-size:13px;
}
.addp:hover{color:var(--ink);border-color:var(--ink)}

.sentinel{height:60px;display:grid;place-items:center;color:var(--muted);font-size:13px}
.empty{text-align:center;color:var(--muted);padding:60px 20px}
.empty strong{display:block;color:var(--ink);font-size:18px;margin-bottom:6px}

/* ---------- Botão novo ponto ---------- */
.fab{
  position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:10;
  background:var(--accent);color:#fff;border:0;border-radius:999px;height:56px;padding:0 22px;
  font-weight:800;font-size:16px;display:flex;align-items:center;gap:8px;
  box-shadow:0 8px 22px rgba(225,29,46,.45);
}
.fab span{font-size:26px;line-height:1;margin-top:-2px}

/* ---------- Diálogos ---------- */
dialog{
  border:0;border-radius:14px;padding:0;width:min(520px,calc(100vw - 24px));max-height:calc(100dvh - 24px);
  box-shadow:0 20px 60px rgba(0,0,0,.35);color:var(--ink);
}
dialog::backdrop{background:rgba(0,0,0,.5)}
.dlg{padding:18px;display:flex;flex-direction:column;gap:14px}
.dlg h2{margin:0;font-size:20px}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700;color:var(--ink-2)}
.field input[type=text],.field textarea{
  border:2px solid var(--ink);border-radius:8px;padding:10px 12px;font-size:16px;font-weight:400;background:#fff;
}
.row{display:flex;gap:10px}
.row .field:first-child{width:110px;flex:none}
.row .field:last-child{flex:1}
.pick{
  border:2px dashed #999;border-radius:8px;background:#f2f2ef;aspect-ratio:16/9;display:grid;place-items:center;
  color:var(--muted);font-size:14px;overflow:hidden;padding:0;width:100%;
}
.pick img{width:100%;height:100%;object-fit:cover}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:2px}
.btn{border:2px solid var(--ink);background:#fff;border-radius:999px;padding:10px 18px;font-weight:700}
.btn.primary{background:var(--ink);color:#fff}
.menu-list{display:flex;flex-direction:column;gap:10px}
.menu-list .btn{text-align:left;border-radius:10px}
.hint{font-size:12px;color:var(--muted);line-height:1.45;margin:0}

.toast{
  position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);
  background:var(--ink);color:#fff;padding:9px 16px;border-radius:999px;font-size:13px;opacity:0;
  transition:.25s;pointer-events:none;z-index:50;max-width:90vw;text-align:center;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<header class="topbar">
  <svg class="chev" viewBox="0 0 34 22" aria-hidden="true"><path d="M0 0h14l10 11-10 11H0l10-11z" fill="#fff"/><path d="M20 0h5l9 11-9 11h-5l9-11z" fill="#fff"/></svg>
  <div class="brand">Controle de Outdoors</div>
  <input class="year" id="year" inputmode="numeric" maxlength="4" aria-label="Ano" placeholder="Ano">
</header>

<div class="titlebar">
  <h1>Pontos</h1>
  <div class="rule"></div>
  <input class="city" id="city" aria-label="Cidade" placeholder="Cidade UF" autocomplete="off">
</div>

<div class="searchbar">
  <div class="inner">
    <label class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Buscar por nº, endereço ou cliente…" enterkeyhint="search" autocomplete="off">
    </label>
    <button class="iconbtn" id="menuBtn" aria-label="Menu">⋯</button>
  </div>
</div>
<div class="count" id="count"></div>

<main>
  <div class="list" id="list"></div>
  <div class="sentinel" id="sentinel"></div>
</main>

<button class="fab" id="addBtn"><span>+</span>Novo ponto</button>

<!-- Novo ponto -->
<dialog id="addDlg">
  <form class="dlg" id="addForm" autocomplete="off">
    <h2>Novo ponto de outdoor</h2>
    <div class="row">
      <label class="field">Nº do ponto
        <input type="text" id="nCode" maxlength="8" required>
      </label>
      <label class="field">Endereço
        <input type="text" id="nAddr" placeholder="Rua, nº – Bairro (referência)" required>
      </label>
    </div>
    <div class="field">Foto do outdoor
      <button type="button" class="pick" id="nPick">Toque para tirar ou escolher uma foto</button>
      <input type="file" id="nFile" accept="image/*" hidden>
    </div>
    <div class="actions">
      <button type="button" class="btn" id="nCancel">Cancelar</button>
      <button type="submit" class="btn primary">Salvar ponto</button>
    </div>
  </form>
</dialog>

<!-- Menu / backup -->
<dialog id="menuDlg">
  <div class="dlg">
    <h2>Backup dos dados</h2>
    <p class="hint">Os dados ficam salvos neste aparelho (neste navegador). Exporte um backup de vez em quando, ou para levar os pontos para outro aparelho.</p>
    <div class="menu-list">
      <button class="btn" id="exportBtn">⬇ Exportar backup (.json)</button>
      <button class="btn" id="importBtn">⬆ Importar backup</button>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
    </div>
    <div class="actions"><button class="btn" id="menuClose">Fechar</button></div>
  </div>
</dialog>

<div class="toast" id="toast"></div>

<script>
(() => {
'use strict';

const PAGE = 8;
const DEFAULT_PERIODS = ['Outubro','Novembro','Dezembro','Janeiro'];
const $ = (s, r = document) => r.querySelector(s);

/* ---------- utilidades ---------- */
function el(tag, props = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === 'dataset') Object.assign(n.dataset, v);
    else if (k in n) n[k] = v;
    else n.setAttribute(k, v);
  }
  n.append(...kids);
  return n;
}
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
const norm = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
let toastTimer;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
}
const autoGrow = ta => { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px'; };

/* ---------- banco local (IndexedDB) ---------- */
const DB = (() => {
  let db;
  const open = () => new Promise((res, rej) => {
    const r = indexedDB.open('outdoor-db', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('points', { keyPath: 'id' });
    r.onsuccess = () => { db = r.result; res(); };
    r.onerror = () => rej(r.error);
  });
  const run = (mode, fn) => new Promise((res, rej) => {
    const t = db.transaction('points', mode);
    const req = fn(t.objectStore('points'));
    t.oncomplete = () => res(req && req.result);
    t.onerror = () => rej(t.error);
    t.onabort = () => rej(t.error);
  });
  return {
    open,
    all: () => run('readonly', s => s.getAll()),
    put: p => run('readwrite', s => s.put(p)),
    del: id => run('readwrite', s => s.delete(id)),
  };
})();

/* ---------- configurações (cidade / ano) ---------- */
const settings = (() => {
  let s = {};
  try { s = JSON.parse(localStorage.getItem('outdoor-settings') || '{}'); } catch (e) {}
  if (!s.year) s.year = String(new Date().getFullYear());
  return s;
})();
const saveSettings = () => { try { localStorage.setItem('outdoor-settings', JSON.stringify(settings)); } catch (e) {} };

/* ---------- estado ---------- */
let points = [];
let filtered = [];
let rendered = 0;
const urlCache = new Map(); // id -> {blob,url}

function photoUrl(p) {
  if (!p.photo) return null;
  const c = urlCache.get(p.id);
  if (c && c.blob === p.photo) return c.url;
  if (c) URL.revokeObjectURL(c.url);
  const url = URL.createObjectURL(p.photo);
  urlCache.set(p.id, { blob: p.photo, url });
  return url;
}
const sortPoints = () => points.sort((a, b) => String(a.code).localeCompare(String(b.code), 'pt-BR', { numeric: true }));
const nextCode = () => {
  const nums = points.map(p => parseInt(p.code, 10)).filter(Number.isFinite);
  return String((nums.length ? Math.max(...nums) : 0) + 1).padStart(3, '0');
};

/* ---------- imagem ---------- */
async function compress(file, max = 1600, quality = 0.82) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const r = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas');
    c.width = Math.round(img.naturalWidth * r); c.height = Math.round(img.naturalHeight * r);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return await new Promise(res => c.toBlob(b => res(b), 'image/jpeg', quality));
  } finally { URL.revokeObjectURL(url); }
}

/* ---------- persistência de um ponto ---------- */
const persist = async p => {
  p.updatedAt = Date.now();
  try { await DB.put(p); toast('Salvo'); }
  catch (e) { toast('Erro ao salvar: espaço insuficiente?'); }
};

/* ---------- cartão ---------- */
function makeCard(p) {
  const card = el('article', { className: 'card', dataset: { id: p.id } });
  const save = debounce(() => persist(p), 400);

  // cabeçalho: Ponto [001] - endereço
  const code = el('input', { className: 'code-in', value: p.code, maxLength: 8, 'aria-label': 'Nº do ponto' });
  const addr = el('textarea', { className: 'addr', rows: 1, value: p.address || '', placeholder: 'Endereço', 'aria-label': 'Endereço' });
  const del = el('button', { className: 'del', type: 'button', title: 'Excluir ponto', textContent: '🗑', 'aria-label': 'Excluir ponto' });
  card.append(el('div', { className: 'head' },
    el('span', { className: 'lbl', textContent: 'Ponto' }), code,
    el('span', { className: 'dash', textContent: '–' }), addr, del));

  // foto + selo
  const badge = el('span', { className: 'badge', textContent: p.code });
  const file = el('input', { type: 'file', accept: 'image/*', hidden: true });
  const photoBox = el('button', { type: 'button', className: 'photo', 'aria-label': 'Foto do outdoor' });
  const paintPhoto = () => {
    photoBox.replaceChildren();
    const u = photoUrl(p);
    if (u) photoBox.append(el('img', { src: u, alt: 'Foto do ponto ' + p.code, loading: 'lazy' }));
    else photoBox.append(el('span', { className: 'ph', textContent: '📷 Toque para adicionar a foto do outdoor' }));
    photoBox.append(badge);
    if (u) photoBox.append(el('span', { className: 'cam', textContent: 'Trocar foto' }));
  };
  paintPhoto();
  photoBox.addEventListener('click', () => file.click());
  file.addEventListener('change', async () => {
    const f = file.files[0]; file.value = '';
    if (!f) return;
    try { p.photo = await compress(f); paintPhoto(); persist(p); }
    catch (e) { toast('Não foi possível ler essa imagem'); }
  });

  // períodos (meses)
  const panel = el('div', { className: 'periods' });
  const paintPeriods = (focusLast) => {
    panel.replaceChildren();
    p.periods.forEach((per, i) => {
      const lab = el('input', { className: 'plabel', value: per.label, 'aria-label': 'Período' });
      const txt = el('input', { className: 'ptext', value: per.text, placeholder: 'Arte / cliente deste período', 'aria-label': 'Arte ou cliente em ' + per.label });
      const rm = el('button', { className: 'prm', type: 'button', textContent: '×', title: 'Remover período', 'aria-label': 'Remover período' });
      lab.addEventListener('input', () => { per.label = lab.value; save(); });
      txt.addEventListener('input', () => { per.text = txt.value; save(); });
      rm.addEventListener('click', () => {
        if ((per.text || '').trim() && !confirm('Remover "' + per.label + '" e o texto dele?')) return;
        p.periods.splice(i, 1); paintPeriods(); persist(p);
      });
      panel.append(el('div', { className: 'period' }, lab, txt, rm));
    });
    const add = el('button', { className: 'addp', type: 'button', textContent: '+ período' });
    add.addEventListener('click', () => {
      p.periods.push({ label: 'Novo período', text: '' });
      paintPeriods(true); persist(p);
    });
    panel.append(add);
    if (focusLast) { const ls = panel.querySelectorAll('.plabel'); const l = ls[ls.length - 1]; l.focus(); l.select(); }
  };
  paintPeriods();

  card.append(el('div', { className: 'body' }, el('div', {}, photoBox, file), panel));

  // eventos do cabeçalho
  code.addEventListener('input', () => { p.code = code.value.trim(); badge.textContent = p.code; save(); });
  code.addEventListener('change', () => { sortPoints(); });
  addr.addEventListener('input', () => { p.address = addr.value; autoGrow(addr); save(); });
  del.addEventListener('click', async () => {
    if (!confirm('Excluir o ponto ' + p.code + '? Isso apaga a foto e os textos.')) return;
    await DB.del(p.id);
    const c = urlCache.get(p.id); if (c) { URL.revokeObjectURL(c.url); urlCache.delete(p.id); }
    points = points.filter(x => x.id !== p.id);
    filtered = filtered.filter(x => x.id !== p.id);
    rendered = Math.max(0, rendered - 1);
    card.remove(); updateCount(); updateEmpty(); toast('Ponto excluído');
  });

  requestAnimationFrame(() => autoGrow(addr));
  return card;
}

/* ---------- lista com rolagem infinita ---------- */
const list = $('#list'), sentinel = $('#sentinel');
const io = new IntersectionObserver(entries => {
  if (entries.some(e => e.isIntersecting)) renderMore();
}, { rootMargin: '600px 0px' });

function renderMore(n = PAGE) {
  if (rendered >= filtered.length) { sentinel.textContent = ''; return; }
  const slice = filtered.slice(rendered, rendered + n);
  const frag = document.createDocumentFragment();
  slice.forEach(p => frag.append(makeCard(p)));
  list.append(frag);
  rendered += slice.length;
  sentinel.textContent = rendered < filtered.length ? 'Carregando mais pontos…' : '';
  // re-observa para disparar de novo se o sentinela continuar visível
  io.unobserve(sentinel); io.observe(sentinel);
}

function applyFilter() {
  const q = norm($('#q').value).trim();
  const terms = q ? q.split(/\s+/) : [];
  filtered = !terms.length ? points.slice() : points.filter(p => {
    const hay = norm([p.code, p.address, ...p.periods.map(x => x.label + ' ' + x.text)].join(' '));
    return terms.every(t => hay.includes(t));
  });
  list.replaceChildren(); rendered = 0;
  renderMore(); updateCount(); updateEmpty();
}

function updateCount() {
  const q = $('#q').value.trim();
  $('#count').textContent = points.length
    ? (q ? `${filtered.length} de ${points.length} pontos` : `${points.length} ponto${points.length > 1 ? 's' : ''}`)
    : '';
}
function updateEmpty() {
  let e = $('#emptyMsg');
  if (filtered.length) { if (e) e.remove(); return; }
  if (!e) { e = el('div', { className: 'empty', id: 'emptyMsg' }); list.after(e); }
  e.replaceChildren();
  if (!points.length) e.append(el('strong', { textContent: 'Nenhum ponto cadastrado ainda' }), 'Toque em “+ Novo ponto” para começar.');
  else e.append(el('strong', { textContent: 'Nenhum ponto encontrado' }), 'Tente buscar por outro número, endereço ou cliente.');
}

$('#q').addEventListener('input', debounce(applyFilter, 150));

/* ---------- novo ponto ---------- */
const addDlg = $('#addDlg'), nFile = $('#nFile'), nPick = $('#nPick');
let newPhoto = null, newPreview = null;

function resetAddForm() {
  $('#nCode').value = nextCode(); $('#nAddr').value = '';
  newPhoto = null; if (newPreview) { URL.revokeObjectURL(newPreview); newPreview = null; }
  nPick.replaceChildren('Toque para tirar ou escolher uma foto');
}
$('#addBtn').addEventListener('click', () => { resetAddForm(); addDlg.showModal(); });
$('#nCancel').addEventListener('click', () => addDlg.close());
nPick.addEventListener('click', () => nFile.click());
nFile.addEventListener('change', async () => {
  const f = nFile.files[0]; nFile.value = '';
  if (!f) return;
  try {
    newPhoto = await compress(f);
    if (newPreview) URL.revokeObjectURL(newPreview);
    newPreview = URL.createObjectURL(newPhoto);
    nPick.replaceChildren(el('img', { src: newPreview, alt: 'Pré-visualização' }));
  } catch (e) { toast('Não foi possível ler essa imagem'); }
});

$('#addForm').addEventListener('submit', async ev => {
  ev.preventDefault();
  const codeVal = $('#nCode').value.trim(), addrVal = $('#nAddr').value.trim();
  if (!codeVal || !addrVal) return;
  if (points.some(p => p.code === codeVal) && !confirm('Já existe um ponto ' + codeVal + '. Cadastrar mesmo assim?')) return;

  // repete os períodos do último ponto cadastrado (só os nomes)
  const last = points.slice().sort((a, b) => b.createdAt - a.createdAt)[0];
  const labels = last ? last.periods.map(x => x.label) : DEFAULT_PERIODS;
  const p = {
    id: uid(), code: codeVal, address: addrVal, photo: newPhoto,
    periods: labels.map(label => ({ label, text: '' })),
    createdAt: Date.now(), updatedAt: Date.now(),
  };
  try { await DB.put(p); } catch (e) { toast('Erro ao salvar o ponto'); return; }
  points.push(p); sortPoints();
  addDlg.close();
  $('#q').value = ''; applyFilter();
  const idx = filtered.findIndex(x => x.id === p.id);
  if (idx >= rendered) renderMore(idx + 1 - rendered);
  const card = list.querySelector(`[data-id="${p.id}"]`);
  if (card) { card.scrollIntoView({ behavior: 'smooth', block: 'center' }); card.classList.add('flash'); }
  toast('Ponto ' + p.code + ' cadastrado');
});

/* ---------- backup ---------- */
const menuDlg = $('#menuDlg');
$('#menuBtn').addEventListener('click', () => menuDlg.showModal());
$('#menuClose').addEventListener('click', () => menuDlg.close());
const blobToDataURL = b => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(b); });

$('#exportBtn').addEventListener('click', async () => {
  try {
    const out = [];
    for (const p of points) out.push({ ...p, photo: p.photo ? await blobToDataURL(p.photo) : null });
    const blob = new Blob([JSON.stringify({ app: 'outdoor-pontos', version: 1, settings, points: out })], { type: 'application/json' });
    const a = el('a', { href: URL.createObjectURL(blob), download: 'outdoors-backup-' + new Date().toISOString().slice(0, 10) + '.json' });
    document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    toast('Backup gerado');
  } catch (e) { toast('Falha ao gerar o backup'); }
});
$('#importBtn').addEventListener('click', () => $('#importFile').click());
$('#importFile').addEventListener('change', async ev => {
  const f = ev.target.files[0]; ev.target.value = '';
  if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    if (!Array.isArray(data.points)) throw new Error('formato');
    for (const raw of data.points) {
      const p = { ...raw, photo: raw.photo ? await (await fetch(raw.photo)).blob() : null };
      if (!p.id) p.id = uid();
      p.periods = Array.isArray(p.periods) ? p.periods : DEFAULT_PERIODS.map(label => ({ label, text: '' }));
      await DB.put(p);
    }
    if (data.settings) { Object.assign(settings, data.settings); saveSettings(); $('#year').value = settings.year || ''; $('#city').value = settings.city || ''; }
    points = await DB.all(); sortPoints(); applyFilter();
    menuDlg.close(); toast('Backup importado');
  } catch (e) { toast('Arquivo de backup inválido'); }
});

/* ---------- cabeçalho (cidade / ano) ---------- */
$('#year').value = settings.year || '';
$('#city').value = settings.city || '';
$('#year').addEventListener('input', e => { settings.year = e.target.value; saveSettings(); });
$('#city').addEventListener('input', e => { settings.city = e.target.value; saveSettings(); });

/* ---------- início ---------- */
(async function init() {
  try {
    await DB.open();
    points = await DB.all(); sortPoints();
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
  } catch (e) {
    toast('Seu navegador bloqueou o armazenamento local (modo privado?)');
  }
  applyFilter();
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();
})();
</script>
</body>
